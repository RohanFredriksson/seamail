name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - name: Run Seamail against fixtures
        run: npm run seamail -- test

      - name: Upload Seamail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamail-report
          path: |
            seamail/report.html
            seamail/results
          if-no-files-found: ignore
          retention-days: 14
